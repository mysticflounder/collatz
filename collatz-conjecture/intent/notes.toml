title = "Young-tower / inducing approach for Lasota-Yorke on induced operator"
body = "Induce the transfer operator L to a smaller set A ⊂ ℤ₂^odd (e.g. A = {n ≡ 1 mod 4}) and study the induced operator L_A, hoping that the first-return map's structure produces a Lasota-Yorke inequality on a Banach space where the original L did not. Standard Young-tower technique from smooth dynamics.\n\n_Reason:_ CLOSED (docs/proofs/function-space-assessment.md §3, 2026-03-19; docs/spectral-limits-analysis.md Result 1; computational test at k=12 with |A|=1024). The induced weight W_I has Lipschitz ratio growing as 2^r exponentially in the 2-adic scale — max oscillation does not decay. The Lasota-Yorke obstruction SURVIVES inducing. Root cause: the inverse branches g_v(n) = (2^v n − 1)/3 involve division by 3, which scrambles the mod-3 class at each step (transfer-operator-spectral-theory.md §8.3). No choice of inducing set avoids intermediate steps through all mod-3 classes; the mod-3 oscillation is intrinsic, not an artifact of where one induces.\n\n_Sources:_ docs/proofs/function-space-assessment.md\ndocs/spectral-limits-analysis.md\ndocs/proofs/transfer-operator-spectral-theory.md"
created_at = "2026-05-12 17:29:35"

[[note]]
kind = "dead_end"
slug = "spectral.joint-mod-filtration"
obligation = "cycle.all_L"
title = "Joint mod-2^k / mod-3^j filtration for spectrum identity"
body = "Propose L respects joint filtration F_{k,j}, making spectral-limit arguments feasible. Fails: filtration is NOT L-invariant. Instead L: F_{k,j} → F_{k-1,j+1} (exact index shift). After k iterations, 2-adic information exhausted (F_{0,j+k}), leaving only 3-adic structure. The only L-invariant direction is purely 3-adic (F_{0,*}), which lacks 2-adic structure. Nonzero eigenvalues come from opposite structural sides. Moreover, mod-3 is not continuous on ℤ₂^{odd} (every ball contains all three residue classes), so L does not map C(ℤ₂^{odd}) → C under integer preimages. Operator is ill-defined on stated space.\n\n_Reason:_ The filtration structure is fundamentally wrong. Not a gap to fix; structural misalignment. Resurrection requires: (1) new space where 2-adic and mod-3 both continuous, or (2) rigorous measure-theoretic interpretation (unproven).\n\n_Sources:_ docs/dead-ends.md"
created_at = "2026-05-12 01:21:56"

[[note]]
kind = "dead_end"
slug = "spectral.lasota-yorke-lip-1"
obligation = "solver.piqd_contract"
title = "Lasota-Yorke inequality on Lip₁(ℤ₂^{odd}, 2-adic metric)"
body = "Attempt to show L preserves Lip₁, i.e., |Lf|_Lip ≤ (1/4)|f|_Lip + B||f||_∞, giving essential spectrum ≤1/4 via Ionescu-Tulcea–Marinescu theorem. Fails: 2-adic contraction by 2^{-v} is exact, but weight 2^{-v} creates net contraction 2^{-2v}. However, every branch has EXACT anti-contraction in 3-adic metric (|g_v(x)−g_v(y)|₃ = 3|x−y|₃). Weight 2^{-v} has no effect on 3-adic expansion (3 is unit in ℤ₂). Moreover, mod-3 is discontinuous in 2-adic topology (every ball contains all three residue classes). So W(n)∈{0,1/3,2/3} is not even continuous in C(ℤ₂^{odd}).\n\n_Reason:_ The obstruction is algebraic/topological, not technical. Lasota-Yorke fails because operator does not map C to C under integer-preimage convention. Under 2-adic-preimage (all v≥1 contribute), ||L||=1 and W=1 (trivial). Either way, failure is fundamental. Any resurrection requires: (1) new ambient space where 2-adic and mod-3 are both continuous (e.g., C(ℤ₂^{odd}×ℤ₃)), or (2) Mahler/Iwasawa/thermodynamic reformulation (unproven research directions).\n\n_Sources:_ docs/proof-strategy-discussion.md\ndocs/dead-ends.md"
created_at = "2026-05-12 01:21:56"

[[note]]
kind = "dead_end"
slug = "spectral.mahler-2adic-unboundedness"
title = "2-adic Mahler/Amice nuclearity program for the transfer operator"
body = "Compute the infinite-dimensional Mahler matrix M_∞ of the transfer operator L on the binomial basis {binom(x,n)}_n over ℤ₂, hoping it decays fast enough to be nuclear (trace-class) on the Amice space A_r (r > 1) — yielding quasi-compactness and bypassing the Lasota-Yorke obstruction.\n\n_Reason:_ PROVED IMPOSSIBLE (docs/proofs/mahler-2adic-unboundedness.md, 2026-03-10). The finite-level transfer matrices satisfy ||P_k||_{2-adic} = 2^{k+O(1)} → ∞, and the Mahler entries M_k[m,j] diverge in the 2-adic topology as k → ∞ (the v_2 valuations shift by exactly -Δk between levels — a clean exact obstruction, not a quantitative decay-rate question). Therefore L is unbounded on C(ℤ₂^odd, ℚ₂) with the 2-adic sup norm; it cannot exist as a bounded operator on ANY 2-adic Banach space of continuous functions. Mahler/Amice nuclearity in the 2-adic category is structurally ruled out.\n\n_Sources:_ docs/proofs/mahler-2adic-unboundedness.md\ndocs/proofs/mahler-weighted-analysis.md\nanalysis/mahler_row_decay.py\nanalysis/mahler_convergence.py\nanalysis/mahler_norm_test.py"
created_at = "2026-05-12 06:00:19"

[[note]]
kind = "dead_end"
slug = "spectral.minus-one-organizing-principle"
title = "-1 ∈ ℤ₂ as organizing principle for 2-adic Collatz analysis"
body = "Treat the 2-adic point -1 ∈ ℤ₂ (which is a fixed point of the Syracuse map's accelerated form, in the sense that 3·(-1)+1 = -2 → -1 after one division by 2) as the natural origin / organizing structural point for the operator-theoretic analysis.\n\n_Reason:_ Structural observation, not exploitable as a proof lever (docs/dead-ends.md §'Prior dead ends'; docs/minus-one-organizing-principle.md). The observation that -1 is a 2-adic fixed point is true but does not produce a spectral / dynamical invariant that distinguishes positive integers from negative-rational ghosts.\n\n_Sources:_ docs/dead-ends.md\ndocs/minus-one-organizing-principle.md"
created_at = "2026-05-12 06:00:19"

[[note]]
kind = "dead_end"
slug = "spectral.negative-rationality-filter"
title = "Filter ghost eigenfunctions by negative-rational support"
body = "Exploit the proved fact that ghost-cycle orbit elements are negative rationals (for concentrated patterns; conjectured in general) by restricting the transfer operator to a function space that distinguishes negative-rational support from positive-integer support — hoping to filter out ghost eigenvalues from the spectrum and recover a clean spectral picture for positive-integer Collatz dynamics.\n\n_Reason:_ CLOSED — conceptual obstruction, not computation-dependent (docs/proofs/function-space-assessment.md §2.6, 2026-03-19). (1) Ghost eigenfunctions are locally constant on ℤ₂^odd and share the same regularity as the trivial eigenfunction from {1}; no regularity-based filter distinguishes them. (2) Support-based filters either fail to be L-invariant or reduce to the trivial space. (3) Restricting to the positive integers IS L-invariant but tautologically restates the Collatz conjecture — no spectral-theoretic leverage. The 2-adic topology does not distinguish positive integers from negative rationals (both are dense in ℤ₂^odd), so any function space defined by 2-adic structure must contain functions that 'see' both.\n\n_Sources:_ docs/proofs/function-space-assessment.md\ndocs/proofs/conjecture3-proof-attempt.md\ndocs/proofs/conjecture4-concentrated-patterns.md"
created_at = "2026-05-12 17:29:35"

[[note]]
kind = "dead_end"
slug = "spectral.ribet-style-reduction"
obligation = "cycle.all_L"
title = "Ribet-style reduction: spectral property implies Collatz via reduction"
body = "Propose spectral invariant of L (gap, compactness, Fredholm determinant zeros) implying structural constraint on positive-integer cycles. Fails: domain mismatch permanent. C(ℤ₂^{odd}) naturally contains both positive integers and negative-rational ghost orbits. Theorems B, C prove every D<0 ghost is negative-rational; positive-integer cycles need D>0 (disjoint regime). No spectral property distinguishes them because operator averages over full 2-adic space. This is STRUCTURAL (insensitive to sign/integrality), not technical. No Banach-space refinement escapes it without abandoning current ambient space.\n\n_Reason:_ The domain mismatch is permanent. Transfer operator on ℤ₂^{odd} studies 2-adic periodic orbits; Collatz asks about positive-integer orbits (measure-zero dense subset). No spectral property of ambient operator can extract positive-integer-specific information. This is not insufficiency; it is orthogonality.\n\n_Sources:_ docs/dead-ends.md\ndocs/viability-assessment-2026-04-19.md\ndocs/ribet-style-reduction.md"
created_at = "2026-05-12 01:21:56"

[[note]]
kind = "dead_end"
slug = "spectral.shifted-coordinate"
title = "Shifted coordinate m=n+1/3 as spectral shortcut"
body = "Conjugated map ℒ̃(m) = 3m/2^{v₂(m)} + 1/3, not purely multiplicative. Transfer operator remains affine-branch (ĝ_v(m) = 2^v(3m−1)/9). Neither Lasota-Yorke obstruction nor 2-adic unboundedness is escaped; both isometrically invariant under σ. Mellin transform diagonalizes approximate operator only, collapsing to 2×2 matrix from mod-3 branching. Ghost cycles don't simplify; cycle equation is trivial rewriting.\n\n_Reason:_ Shifted coordinate is notational convenience (connects to Benford's law, random walk literature) but opens no new doors. Obstructions are coordinate-invariant. Literature (Wirsching, Berg-Meinardus, Chamberland, Lagarias-Soundararajan) has extracted statistical content; no new spectral leverage remains.\n\n_Sources:_ docs/shifted-coordinate-analysis.md"
created_at = "2026-05-12 01:21:56"

[[note]]
kind = "dead_end"
slug = "spectral.singularity-at-minus-one-third"
title = "Exploit the singularity at -1/3 ∈ ℤ₂^odd to sharpen spectral bounds"
body = "The Syracuse map S(n) = (3n+1)/2^{v_2(3n+1)} has a unique 2-adic singularity at n = -1/3 (where 3n+1 = 0 and S is undefined). Attempt to use local dynamics near this singularity to sharpen the spectral-radius bound ρ(L) ≤ 1/2 or obtain a sharper Lasota-Yorke inequality.\n\n_Reason:_ Singularity is dynamically harmless and cannot be exploited (docs/proofs/singularity-analysis.md). The Lasota-Yorke obstruction is GLOBAL — it arises from mod-3 oscillation at every point — not local at -1/3. (L·f)(-1/3) = 0 is topologically significant (accumulation point of preimage tree) but produces no new spectral information. Non-archimedean Fatou/Julia analogues and Iwasawa-theoretic interpretations are structurally interesting but do not sharpen any bound.\n\n_Sources:_ docs/proofs/singularity-analysis.md"
created_at = "2026-05-12 06:00:19"

[[note]]
kind = "dead_end"
slug = "spectral.transfer-operator-on-C-Z2odd"
title = "Transfer operator L bounded on C(ℤ₂^odd) per Paper C's Convention A/B"
body = "Paper C / merged-paper claim: L on C(ℤ₂^odd) is a bounded operator with ||L|| = 2/3 and spectrum equal to closure of ⋃_k σ(P_k). Uses preimage convention 'sum over v with 3 | (n·2^v − 1)'.\n\n_Reason:_ Ruled out (docs/dead-ends.md §'Transfer operator L on C(ℤ₂^odd)', 2026-04-20; verified in analysis/verify_operator_setup.py at k=3). Three independent problems: (1) the preimage convention is ambiguous — Convention A (integer preimages) makes L·1 = W discontinuous on ℤ₂ since mod-3 is not 2-adically continuous, so L: C → C is ill-defined; Convention B (2-adic preimages) gives ||L|| = 1 not 2/3. (2) P_k is a forward functional-graph matrix, not a restriction of L; verified mismatch in 12/13 nonzero entries at k=3. (3) Under B, L·1 = 1 so 1 ∈ σ(L) with eigenfunction 1, but σ(P_k) ⊆ {0, 1/4} for non-exceptional k — the claimed spectral equality fails. Theorem 3(e) of the archived paper is wrong.\n\n_Sources:_ docs/dead-ends.md\ndocs/archive/collatz-transfer-operator.md\ndocs/archive/collatz-transfer-matrices-operators.md\ndocs/spectral-limits-analysis.md\ndocs/reviews/paper-c-pre-submission-audit-2026-04-19.md\nanalysis/verify_operator_setup.py"
