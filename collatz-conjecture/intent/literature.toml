[[literature]]
slug = "paper-b"
title = "2-Adic Local Constancy of the Collatz Transfer Matrix and a Sharp Modulus M = k + V"
citation = "mckenna-2026-paper-b"
body = "Theorem 1 + Proposition 4: x ↦ P_k(x,y) locally constant on Z_2^{odd} with tight modulus M = k + V(k,x,y). Corollaries: Fredholm determinant locally constant, spectral radius locally constant, finitely many matrices per k. \n\nNOT publish-ready as currently framed (math-skeptic audit 2026-05-11, docs/reviews/swarm-2026-05-11/paper-b-skeptic-2026-05-11.md): the qualitative local-constancy half is folklore (Terras 1976, Korec 1992/1994, Eliahou 1993, Möller 1978, Wirsching 1998) and the literature review cites none of those four canonical sources. The strongest residual novelty is the sharp modulus M = k + V with explicit Collatz worst-case j_m = (4^m - 1)/3 — a 4–6 page note, not a paper as currently structured. Editorial fixes alone will not close this; a literature pass is required first.\n\n_Authors:_ McKenna, A.\n_Year:_ 2026\n_Venue:_ arXiv (in preparation; target: Experimental Mathematics)"
created_at = "2026-05-12 02:34:38"

[[literature]]
slug = "paper-c"
title = "Collatz Transfer Operator (working title; to be absorbed into Paper A)"
citation = "mckenna-2026-paper-c"
body = "Operator-theoretic results (Lemmas 1–3, Theorems 1–2) on transfer-operator norm, spectral radius bounds, and the Lasota-Yorke obstruction. Disqualified for standalone arXiv: Theorem 3 has a falsified hypothesis (E is infinite per Paper A) and every section uses manual \\setcounter, violating CLAUDE.md. Per arxiv-strategy (2026-03-09), operator theory (§2–7) is being merged into Paper A; Theorem 3 will be deleted or demoted to a historical remark.\n\n_Authors:_ McKenna, A.\n_Year:_ 2026\n_Venue:_ internal draft (not for standalone submission)"
created_at = "2026-05-12 02:34:38"

