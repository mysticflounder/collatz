[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collatz*", "webapp*"]

[project]
name = "collatz"
version = "0.1.0"
description = "Computational exploration of the Collatz conjecture"
requires-python = ">=3.11"
dependencies = [
    "gmpy2",
    "numpy",
    "matplotlib",
    "scipy",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "jupyter",
]
webapp = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "watchdog>=4.0",
    "ptyprocess>=0.7",
    "aiofiles>=23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/analysis/*",
    "*/collatz/visualize.py",
]
